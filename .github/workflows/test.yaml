---
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Cache CMake dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/_deps
          key: cache-${{ hashFiles('./test/CMakeLists.txt') }}

      - name: Prepare apt package cache
        run: mkdir -p "$RUNNER_TEMP/apt-cache/archives/partial"

      - name: Cache apt packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/apt-cache/archives
          key: ${{ runner.os }}-${{ runner.arch }}-apt-openmpi-cxx-v1

      - name: Install and setup MPI
        run: |
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-cache/archives" install --no-install-recommends -y g++ libopenmpi-dev openmpi-bin
          printf 'CXX=%s\nOMPI_CXX=%s\n' "$(command -v mpic++)" "$(command -v g++)" >> "$GITHUB_ENV"

      - name: Build tests
        run:
          cmake -B build;
          cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
